<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>数学アプリ集</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f6f3;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 56px 22px 70px;
    }

    header {
      margin-bottom: 42px;
    }

    .label {
      font-size: 13px;
      letter-spacing: 0.18em;
      color: #777;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 52px);
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin-top: 14px;
      color: #666;
      font-size: 15px;
      line-height: 1.8;
    }

    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;

      background: #ffffff;
      border: 1px solid #e4e4df;
      border-radius: 18px;

      padding: 25px 24px;
      min-height: 170px;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #c8c8c2;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .number {
      font-size: 12px;
      color: #999;
      letter-spacing: 0.12em;
      margin-bottom: 22px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .description {
      font-size: 14px;
      line-height: 1.7;
      color: #666;
    }

    footer {
      margin-top: 52px;
      padding-top: 20px;
      border-top: 1px solid #dddcd6;

      color: #999;
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 600px) {
      .container {
        padding-top: 40px;
      }

      .apps {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: auto;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header>
      <div class="label">MATHEMATICS / INTERACTIVE</div>

      <h1>数学アプリ（実験中…）</h1>

      <p class="subtitle">
        数学を体感しよう。<br>
      </p>
    </header>


    <section class="apps">

      <!-- アプリ 01 -->
      <a class="card" href="polcutp.html">

        <div class="number">01</div>

        <div class="title">
          数A_多面体の断面の観察
        </div>

        <div class="description">
          正六面体の断面をイメージしましょう。
        </div>

      </a>

      <!-- アプリ 02 -->
      <a class="card" href="polcut.html">

        <div class="number">02</div>

        <div class="title">
          正多面体の頂点を切断
        </div>

        <div class="description">
          オイラーの多面体定理が成立していることを確認しよう。
        </div>

      </a>
      <!--
      ==================================================
      2つ目以降のアプリは、この形で追加できます。
      ==================================================

      <a class="card" href="example.html">

        <div class="number">02</div>

        <div class="title">
          アプリの名前
        </div>

        <div class="description">
          アプリの説明をここに書きます。
        </div>

      </a>

      -->


    </section>


    <footer>
      Mathematics / Interactive Learning
    </footer>

  </main>

</body>
</html>
