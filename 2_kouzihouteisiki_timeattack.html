<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高次方程式 7分チャレンジ 〜数学II ランダム演習〜</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX for crisp LaTeX Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;900&family=Noto+Sans+JP:wght@400;600;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #080c14;
            color: #f1f5f9;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
        }

        /* 難易度・モード別オーラ演出 */
        .card-lvl-1 { border-color: rgba(59, 130, 246, 0.4); box-shadow: 0 0 20px rgba(59, 130, 246, 0.15); }
        .card-lvl-2 { border-color: rgba(168, 85, 247, 0.4); box-shadow: 0 0 20px rgba(168, 85, 247, 0.15); }
        .card-lvl-3 { border-color: rgba(20, 184, 166, 0.4); box-shadow: 0 0 20px rgba(20, 184, 166, 0.15); }
        
        /* 複二次式（ネオンパープル） */
        .card-lvl-4 {
            border-color: rgba(236, 72, 153, 0.7);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.3);
            animation: pulse-pink 3s infinite ease-in-out;
        }
        /* 相反方程式（ゴールド天秤） */
        .card-lvl-5 {
            border-color: rgba(234, 179, 8, 0.7);
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.3);
            animation: pulse-gold 3s infinite ease-in-out;
        }

        @keyframes pulse-pink {
            0%, 100% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.25); }
            50% { box-shadow: 0 0 35px rgba(236, 72, 153, 0.55); }
        }
        @keyframes pulse-gold {
            0%, 100% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.25); }
            50% { box-shadow: 0 0 35px rgba(234, 179, 8, 0.55); }
        }

        /* ポイントポッパーアニメーション */
        @keyframes scoreFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.4); }
        }
        .score-popup {
            animation: scoreFloat 1.2s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }

        /* 横スクロール対応タブ */
        .level-scroll-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .level-scroll-container::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- ヘッダー ＆ スコア・タイマーバー -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-3 py-2.5 flex flex-wrap items-center justify-between gap-3">
            
            <!-- アプリタイトル -->
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center text-white font-black shadow-lg shadow-amber-500/20">
                    <i class="fa-solid fa-stopwatch text-base"></i>
                </div>
                <div>
                    <h1 class="text-sm md:text-base font-bold bg-gradient-to-r from-amber-400 via-orange-300 to-yellow-500 bg-clip-text text-transparent">
                        高次方程式 7分アタック
                    </h1>
                    <p class="text-[10px] text-slate-400">数学II 因数定理演習</p>
                </div>
            </div>

            <!-- タイマーコントロール（デジタル表示 ＆ スタート / ストップ / 7分リセット） -->
            <div class="flex flex-wrap items-center gap-2 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800">
                <div class="flex items-center space-x-1.5 mr-1">
                    <i class="fa-regular fa-clock text-cyan-400 text-xs sm:text-sm"></i>
                    <span id="timer-display" class="font-mono text-base sm:text-lg font-black tracking-widest text-white">07:00</span>
                </div>
                
                <div class="flex items-center space-x-1">
                    <button onclick="startTimer()" id="btn-timer-start" class="text-[11px] px-2.5 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-bold transition active:scale-95 flex items-center gap-1">
                        <i class="fa-solid fa-play text-[9px]"></i>スタート
                    </button>
                    <button onclick="stopTimer()" id="btn-timer-stop" class="text-[11px] px-2.5 py-1 rounded bg-rose-600/80 hover:bg-rose-500 text-white font-bold transition active:scale-95 flex items-center gap-1">
                        <i class="fa-solid fa-pause text-[9px]"></i>ストップ
                    </button>
                    <button onclick="resetTimer()" id="btn-timer-reset" class="text-[11px] px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold border border-slate-700 transition active:scale-95 flex items-center gap-1">
                        <i class="fa-solid fa-rotate-left text-[9px]"></i>7分に戻す
                    </button>
                </div>
            </div>

            <!-- ポイント・カップ（トロフィー）リワード -->
            <div class="relative flex items-center space-x-1.5 bg-gradient-to-r from-amber-950/80 to-slate-900 px-3 py-1.5 rounded-xl border border-amber-500/40 text-amber-300 shadow-lg shadow-amber-500/10">
                <i class="fa-solid fa-trophy text-amber-400 text-sm sm:text-base animate-bounce"></i>
                <div class="flex flex-col text-right">
                    <span id="reward-points" class="font-black text-sm sm:text-base font-mono leading-none text-amber-300">0</span>
                    <span class="text-[9px] text-amber-400/80 font-bold">PTS</span>
                </div>
                <!-- 得点獲得時のポップアップ領域 -->
                <div id="score-popup-container" class="absolute -top-6 right-2 pointer-events-none"></div>
            </div>

        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-3 sm:p-5 flex flex-col gap-4">

        <!-- 難易度レベル選択タブ -->
        <div class="glass-card rounded-2xl p-3 border border-slate-800">
            <div class="flex items-center justify-between mb-2 px-1">
                <span class="text-xs font-bold text-slate-300 flex items-center">
                    <i class="fa-solid fa-layer-group text-cyan-400 mr-1.5"></i>出題レベル選択（タップで変更）
                </span>
                <span id="current-range-badge" class="text-[10px] font-bold text-cyan-300 px-2 py-0.5 rounded-full bg-cyan-950 border border-cyan-800">
                    Lv.1〜5 ランダム
                </span>
            </div>

            <div class="level-scroll-container gap-2 pb-1">
                <button onclick="setLevel(0)" id="lvl-btn-0" class="level-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap bg-cyan-500/20 border border-cyan-400 text-cyan-300">
                    <i class="fa-solid fa-shuffle mr-1"></i>全開放 (Lv.1〜5)
                </button>
                <button onclick="setLevel(1)" id="lvl-btn-1" class="level-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-900 border border-slate-800 text-slate-400">
                    Lv.1 基本(3次) <span class="text-[10px] text-amber-400 ml-0.5">(1pt)</span>
                </button>
                <button onclick="setLevel(2)" id="lvl-btn-2" class="level-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-900 border border-slate-800 text-slate-400">
                    Lv.2 虚数解含む <span class="text-[10px] text-amber-400 ml-0.5">(2pt)</span>
                </button>
                <button onclick="setLevel(3)" id="lvl-btn-3" class="level-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-900 border border-slate-800 text-slate-400">
                    Lv.3 一般4次式 <span class="text-[10px] text-amber-400 ml-0.5">(3pt)</span>
                </button>
                <button onclick="setLevel(4)" id="lvl-btn-4" class="level-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-900 border border-slate-800 text-slate-400">
                    Lv.4 複二次式 <span class="text-[10px] text-amber-400 ml-0.5">(4pt)</span>
                </button>
                <button onclick="setLevel(5)" id="lvl-btn-5" class="level-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-900 border border-slate-800 text-slate-400">
                    Lv.5 相反方程式 <span class="text-[10px] text-amber-400 ml-0.5">(5pt)</span>
                </button>
            </div>
        </div>

        <!-- 問題カードエリア -->
        <div id="problem-card" class="glass-card rounded-2xl p-5 sm:p-7 relative transition-all duration-500 card-lvl-1">
            
            <!-- 問題ヘッダー情報 -->
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center space-x-2">
                    <span id="problem-level-badge" class="px-3 py-1 rounded-full text-xs font-black bg-blue-500/20 text-blue-300 border border-blue-500/40">
                        LEVEL 1
                    </span>
                    <span id="problem-point-badge" class="text-xs font-extrabold text-amber-400">
                        +1 Point
                    </span>
                </div>
                
                <div class="flex items-center space-x-2 text-xs text-slate-400">
                    <span>正解数:</span>
                    <span id="solved-count" class="font-black text-white">0</span> 題
                </div>
            </div>

            <!-- 数式表示 (KaTeX rendering) -->
            <div class="py-4 text-center overflow-x-auto">
                <div id="katex-equation" class="text-2xl sm:text-3xl font-black tracking-wide text-white min-w-max mx-auto py-1"></div>
            </div>

            <!-- 特殊方程式演出バナー -->
            <div id="special-hint-banner" class="hidden my-3 p-3 rounded-xl bg-slate-950/80 border text-xs flex items-center space-x-3">
                <i id="special-hint-icon" class="fa-solid fa-bolt text-lg shrink-0"></i>
                <div id="special-hint-text" class="leading-relaxed"></div>
            </div>

            <!-- 解答入力エリア -->
            <div class="mt-4 space-y-3">
                <label class="block text-xs font-bold text-slate-300">
                    すべての解をカンマ区切りで入力 (\(x =\)):
                </label>
                
                <div class="flex gap-2">
                    <input type="text" id="user-answer-input" placeholder="例: 1, -2, 3 または 1, 2±i" class="flex-1 bg-slate-950 border border-slate-700 focus:border-cyan-400 rounded-xl px-4 py-3 text-slate-100 font-mono text-base focus:outline-none shadow-inner">
                    <button onclick="checkAnswer()" class="px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-black text-sm shadow-lg shadow-cyan-500/25 transition-all active:scale-95 shrink-0">
                        回答する
                    </button>
                </div>

                <!-- スマホ用入力サポートキー -->
                <div class="flex flex-wrap gap-1.5 pt-1">
                    <span class="text-[10px] text-slate-400 self-center mr-1">入力補助:</span>
                    <button onclick="insertChar('±')" class="px-2.5 py-1 rounded bg-slate-800 text-xs font-mono text-cyan-300 border border-slate-700 hover:bg-slate-700">±</button>
                    <button onclick="insertChar('i')" class="px-2.5 py-1 rounded bg-slate-800 text-xs font-mono text-pink-300 border border-slate-700 hover:bg-slate-700">i</button>
                    <button onclick="insertChar('\\sqrt{}')" class="px-2.5 py-1 rounded bg-slate-800 text-xs font-mono text-amber-300 border border-slate-700 hover:bg-slate-700">√</button>
                    <button onclick="insertChar(', ')" class="px-2.5 py-1 rounded bg-slate-800 text-xs font-mono text-slate-300 border border-slate-700 hover:bg-slate-700">, (カンマ)</button>
                    <button onclick="insertChar('-')" class="px-2.5 py-1 rounded bg-slate-800 text-xs font-mono text-slate-300 border border-slate-700 hover:bg-slate-700">-</button>
                </div>
            </div>

            <!-- フィードバック表示 -->
            <div id="feedback-box" class="hidden mt-4 p-4 rounded-xl text-xs font-bold"></div>

            <!-- 解説アコーディオン -->
            <div id="explanation-box" class="hidden mt-4 border-t border-slate-800 pt-4">
                <button onclick="toggleExplanation()" class="flex items-center justify-between w-full text-xs font-bold text-slate-300 hover:text-cyan-300">
                    <span><i class="fa-solid fa-book-open text-cyan-400 mr-2"></i>この問題の詳しい解法ステップ・解説</span>
                    <i id="exp-chevron" class="fa-solid fa-chevron-down transition-transform"></i>
                </button>
                
                <div id="exp-content" class="hidden mt-3 space-y-3 text-xs text-slate-300 leading-relaxed bg-slate-950/70 p-4 rounded-xl border border-slate-800">
                    <!-- 動的挿入 -->
                </div>
            </div>

            <!-- 次の問題へボタン -->
            <div id="next-btn-container" class="hidden mt-5">
                <button onclick="generateNextProblem()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black text-sm shadow-lg shadow-emerald-500/25 transition-all flex items-center justify-center space-x-2 active:scale-95">
                    <span>次の問題へ進む</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

        </div>

    </main>

    <!-- タイムアップ・モーダル -->
    <div id="timeup-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-xl z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center border border-amber-500/40 shadow-2xl">
            <div class="w-16 h-16 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/40 flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-trophy animate-bounce"></i>
            </div>
            <h2 class="text-xl font-black text-white mb-1">7分間タイムアップ！</h2>
            <p class="text-xs text-slate-400 mb-6">おつかれさまでした！演習結果です。</p>

            <div class="bg-slate-900/90 rounded-2xl p-4 border border-slate-800 space-y-3 mb-6">
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-400">獲得合計ポイント:</span>
                    <span id="final-points" class="font-black text-lg text-amber-300 font-mono">0 PTS</span>
                </div>
                <div class="flex justify-between items-center text-xs">
                    <span class="text-slate-400">正解問題数:</span>
                    <span id="final-solved" class="font-bold text-base text-white">0 題</span>
                </div>
            </div>

            <button onclick="restartChallenge()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white font-black text-sm shadow-lg shadow-amber-500/20 transition-all active:scale-95">
                もう一度挑戦する
            </button>
        </div>
    </div>

    <footer class="border-t border-slate-800/80 py-3 text-center text-[10px] text-slate-500">
        高校数学II インタラクティブ演習 〜因数定理と高次方程式〜
    </footer>

    <!-- スクリプト本体 -->
    <script>
        // 問題生成用テンプレート群
        const PROBLEM_BANK = {
            lvl1: [ // 3次・有理数解
                { coeffs: [1, -6, 11, -6], display: "x^3 - 6x^2 + 11x - 6 = 0", ans: ["1", "2", "3"], k: 1, q: [1, -5, 6] },
                { coeffs: [1, -2, -1, 2], display: "x^3 - 2x^2 - x + 2 = 0", ans: ["1", "-1", "2"], k: 1, q: [1, -1, -2] },
                { coeffs: [1, -4, 1, 6], display: "x^3 - 4x^2 + x + 6 = 0", ans: ["-1", "2", "3"], k: -1, q: [1, -5, 6] },
                { coeffs: [1, 3, -4, -12], display: "x^3 + 3x^2 - 4x - 12 = 0", ans: ["2", "-2", "-3"], k: 2, q: [1, 5, 6] },
            ],
            lvl2: [ // 虚数解含む
                { coeffs: [1, -3, 7, -5], display: "x^3 - 3x^2 + 7x - 5 = 0", ans: ["1", "1±2i"], k: 1, q: [1, -2, 5], disc: -16 },
                { coeffs: [1, 1, -2, 8], display: "x^3 + x^2 - 2x + 8 = 0", ans: ["-2", "1±sqrt(3)i", "1±√3i"], k: -2, q: [1, -1, 4], disc: -12 },
                { coeffs: [1, -1, 1, -1], display: "x^3 - x^2 + x - 1 = 0", ans: ["1", "±i"], k: 1, q: [1, 0, 1], disc: -4 },
            ],
            lvl3: [ // 一般4次方程式
                { coeffs: [1, -2, -3, 8, -4], display: "x^4 - 2x^3 - 3x^2 + 8x - 4 = 0", ans: ["1", "2", "-2"], k: 1, q: [1, -1, -4, 4] },
                { coeffs: [1, -5, 5, 5, -6], display: "x^4 - 5x^3 + 5x^2 + 5x - 6 = 0", ans: ["1", "-1", "2", "3"], k: 1, q: [1, -4, 1, 6] },
            ],
            lvl4: [ // 複二次式 (ax^4 + bx^2 + c = 0)
                { coeffs: [1, 0, -5, 0, 4], display: "x^4 - 5x^2 + 4 = 0", ans: ["1", "-1", "2", "-2", "±1, ±2"], type: "biquadratic", hint: "t = x^2 と置くと t^2 - 5t + 4 = 0" },
                { coeffs: [1, 0, -10, 0, 9], display: "x^4 - 10x^2 + 9 = 0", ans: ["1", "-1", "3", "-3", "±1, ±3"], type: "biquadratic", hint: "t = x^2 と置くと t^2 - 10t + 9 = 0" },
                { coeffs: [1, 0, 4, 0, 0], display: "x^4 + 4 = 0", ans: ["1±i", "-1±i", "±1±i"], type: "biquadratic", hint: "(x^2 + 2)^2 - 4x^2 = 0 と平方の差に変形" }
            ],
            lvl5: [ // 相反方程式 (ax^4 + bx^3 + cx^2 + bx + a = 0)
                { coeffs: [1, -3, 4, -3, 1], display: "x^4 - 3x^3 + 4x^2 - 3x + 1 = 0", ans: ["1±i", "(1±sqrt(3)i)/2", "1±i, (1±√3i)/2"], type: "reciprocal", hint: "両辺を x^2 で割り t = x + 1/x と置く" },
                { coeffs: [1, -5, 6, -5, 1], display: "x^4 - 5x^3 + 6x^2 - 5x + 1 = 0", ans: ["1", "2±sqrt(3)", "2±√3"], type: "reciprocal", hint: "両辺を x^2 で割り t = x + 1/x と置く" }
            ]
        };

        // 状態変数
        let currentLevelFilter = 0; // 0: 全開放, 1~5: 指定レベル
        let currentProblem = null;
        let totalPoints = 0;
        let solvedCount = 0;
        let timerSeconds = 420; // 7分 (420秒)
        let timerInterval = null;
        let isTimerRunning = false;

        window.onload = function() {
            setLevel(0);
            startTimer();
        };

        // DOM要素内のKaTeX安全レンダリング処理
        function safeRenderMath(element) {
            if (!element) return;
            try {
                renderMathInElement(element, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    throwOnError: false
                });
            } catch (e) {
                console.error("Math rendering error:", e);
            }
        }

        // --- タイマー操作機能 ---

        // 1. スタート（計測開始）
        function startTimer() {
            if (isTimerRunning) return;
            isTimerRunning = true;
            
            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerDisplay();
                
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    isTimerRunning = false;
                    showTimeUpModal();
                }
            }, 1000);
        }

        // 2. ストップ（一時停止）
        function stopTimer() {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
            }
        }

        // 3. 7分に戻す（リセット）
        function resetTimer() {
            stopTimer();
            timerSeconds = 420;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
            const s = (timerSeconds % 60).toString().padStart(2, '0');
            const display = document.getElementById('timer-display');
            display.textContent = `${m}:${s}`;
            
            if (timerSeconds <= 60) {
                display.className = "font-mono text-base sm:text-lg font-black tracking-widest text-rose-500 animate-pulse";
            } else {
                display.className = "font-mono text-base sm:text-lg font-black tracking-widest text-white";
            }
        }

        function showTimeUpModal() {
            document.getElementById('final-points').textContent = `${totalPoints} PTS`;
            document.getElementById('final-solved').textContent = `${solvedCount} 題`;
            document.getElementById('timeup-modal').classList.remove('hidden');
            confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });
        }

        function restartChallenge() {
            totalPoints = 0;
            solvedCount = 0;
            document.getElementById('reward-points').textContent = "0";
            document.getElementById('solved-count').textContent = "0";
            document.getElementById('timeup-modal').classList.add('hidden');
            resetTimer();
            startTimer();
            generateNextProblem();
        }

        // 出題レベルの設定切り替え
        function setLevel(lvl) {
            currentLevelFilter = lvl;
            
            // タブデザイン更新
            document.querySelectorAll('.level-btn').forEach((btn, idx) => {
                if (idx === lvl) {
                    btn.className = "level-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap bg-cyan-500/20 border border-cyan-400 text-cyan-300 shadow-lg shadow-cyan-500/10";
                } else {
                    btn.className = "level-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-900 border border-slate-800 text-slate-400";
                }
            });

            const badge = document.getElementById('current-range-badge');
            if (lvl === 0) badge.textContent = "Lv.1〜5 ランダム";
            else badge.textContent = `Lv.${lvl} 固定出題`;

            generateNextProblem();
        }

        // ランダム問題の生成
        function generateNextProblem() {
            let targetLvl = currentLevelFilter;
            if (targetLvl === 0) {
                targetLvl = Math.floor(Math.random() * 5) + 1;
            }

            const bankKey = `lvl${targetLvl}`;
            const pool = PROBLEM_BANK[bankKey];
            const prob = pool[Math.floor(Math.random() * pool.length)];

            currentProblem = { ...prob, level: targetLvl };

            // UIレンダリング
            const card = document.getElementById('problem-card');
            card.className = `glass-card rounded-2xl p-5 sm:p-7 relative transition-all duration-500 card-lvl-${targetLvl}`;

            document.getElementById('problem-level-badge').textContent = `LEVEL ${targetLvl}`;
            document.getElementById('problem-point-badge').textContent = `+${targetLvl} Point${targetLvl > 1 ? 's' : ''}`;

            // 数式描画
            katex.render(currentProblem.display, document.getElementById('katex-equation'), { displayMode: true, throwOnError: false });

            // 特殊モード演出バナー
            const banner = document.getElementById('special-hint-banner');
            const icon = document.getElementById('special-hint-icon');
            const hintText = document.getElementById('special-hint-text');

            if (currentProblem.type === 'biquadratic') {
                banner.classList.remove('hidden');
                banner.className = "my-3 p-3 rounded-xl bg-pink-950/60 border border-pink-500/40 text-xs text-pink-200 flex items-center space-x-3";
                icon.className = "fa-solid fa-bolt text-pink-400 text-lg shrink-0";
                hintText.innerHTML = `<b>【複二次式モード】</b> ${currentProblem.hint}`;
            } else if (currentProblem.type === 'reciprocal') {
                banner.classList.remove('hidden');
                banner.className = "my-3 p-3 rounded-xl bg-amber-950/60 border border-amber-500/40 text-xs text-amber-200 flex items-center space-x-3";
                icon.className = "fa-solid fa-scale-balanced text-amber-400 text-lg shrink-0";
                hintText.innerHTML = `<b>【相反方程式モード】</b> ${currentProblem.hint}`;
            } else {
                banner.classList.add('hidden');
            }

            safeRenderMath(banner);

            // フォームリセット
            document.getElementById('user-answer-input').value = "";
            document.getElementById('feedback-box').classList.add('hidden');
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn-container').classList.add('hidden');

            // 解説コンテンツの構築
            buildExplanationText();
        }

        // スマホ用キーパッド入力補助
        function insertChar(str) {
            const input = document.getElementById('user-answer-input');
            input.value += str;
            input.focus();
        }

        // 解答判定処理
        function checkAnswer() {
            const userInput = document.getElementById('user-answer-input').value.trim();
            const feedback = document.getElementById('feedback-box');
            feedback.classList.remove('hidden');

            if (!userInput) {
                feedback.className = "p-3 rounded-xl text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30";
                feedback.textContent = "解を入力してください！";
                return;
            }

            // 正解判定
            const cleanUser = userInput.replace(/\s+/g, '');
            const isCorrect = currentProblem.ans.some(a => cleanUser.includes(a.replace(/\s+/g, '')));

            if (isCorrect) {
                feedback.className = "p-4 rounded-xl text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 flex items-center justify-between";
                feedback.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
                        <span>正解です！ +${currentProblem.level} PTS 獲得！</span>
                    </div>
                `;

                // ポイント加算演出
                addRewardPoints(currentProblem.level);
                solvedCount++;
                document.getElementById('solved-count').textContent = solvedCount;

                confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });

                document.getElementById('explanation-box').classList.remove('hidden');
                document.getElementById('next-btn-container').classList.remove('hidden');
            } else {
                feedback.className = "p-4 rounded-xl text-xs font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30";
                feedback.innerHTML = `
                    <i class="fa-solid fa-circle-xmark mr-1.5"></i> 不正解です。もう一度計算するか、下の解説を確認してみましょう！
                `;
                document.getElementById('explanation-box').classList.remove('hidden');
            }
        }

        // ポイント獲得アニメーション
        function addRewardPoints(pts) {
            totalPoints += pts;
            const ptsElem = document.getElementById('reward-points');
            ptsElem.textContent = totalPoints;

            // フローティングポップアップ生成
            const container = document.getElementById('score-popup-container');
            const popup = document.createElement('div');
            popup.className = "score-popup text-amber-300 font-black text-sm font-mono drop-shadow";
            popup.textContent = `+${pts}pt!`;
            container.appendChild(popup);

            setTimeout(() => popup.remove(), 1200);
        }

        // 解説アコーディオン構築
        function buildExplanationText() {
            const expContent = document.getElementById('exp-content');
            
            let html = `<p class="font-bold text-cyan-300 border-b border-slate-800 pb-1">【解答】 \\( x = ${currentProblem.ans[0]} \\)</p>`;

            if (currentProblem.k !== undefined) {
                html += `
                    <p><b>1. 因数定理:</b> 代入して 0 になる値を探索します。<br>
                    \\( P(${currentProblem.k}) = 0 \\) となるため、\\( (x - ${currentProblem.k < 0 ? `(${currentProblem.k})` : currentProblem.k}) \\) を因数に持ちます。</p>
                    <p><b>2. 多項式の割り算（筆算）:</b> 元の式を割って商を求めます。</p>
                `;
            }

            if (currentProblem.type === 'biquadratic') {
                html += `<p><b>置換解説:</b> \\( t = x^2 \\) とおくことで、\\( t \\) の2次方程式に変換して因数分解します。</p>`;
            } else if (currentProblem.type === 'reciprocal') {
                html += `<p><b>相反方程式解説:</b> 両辺を \\( x^2 \\) で割り、\\( x + \\frac{1}{x} = t \\) の置換を利用します。</p>`;
            }

            expContent.innerHTML = html;
            safeRenderMath(expContent);
        }

        function toggleExplanation() {
            const exp = document.getElementById('exp-content');
            const icon = document.getElementById('exp-chevron');
            if (exp.classList.contains('hidden')) {
                exp.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                exp.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }
    </script>
</body>
</html>
